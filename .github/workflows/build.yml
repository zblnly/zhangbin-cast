name: 张斌手机投屏 — 自动编译 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build-phone:
    name: 📱 编译手机端 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-app

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授权 Gradle
        run: chmod +x gradlew

      - name: 编译手机端 APK (Debug)
        run: ./gradlew assembleDebug

      - name: 上传手机端 APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-debug
          path: phone-app/app/build/outputs/apk/debug/app-debug.apk

  build-tv:
    name: 📺 编译电视端 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授权 Gradle
        run: chmod +x gradlew

      - name: 编译电视端 APK (Debug)
        run: ./gradlew assembleDebug

      - name: 上传电视端 APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-app-debug
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
